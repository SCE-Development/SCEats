services:
  backend:
    build: ./backend
    volumes:
      - snacks-data:/app/data
    ports:
      - "6970:6970"
  frontend:
    build:
      dockerfile: ./Dockerfile
      context: ./client
  sceats:
    container_name: sceats
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "6969:6969"

volumes:
  snacks-data:

networks: 
  default:
    external: 
      name: poweredge
