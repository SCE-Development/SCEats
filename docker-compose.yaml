services:
  backend:
    build: ./backend
    volumes:
      - snacks-data:/app/data
  frontend:
    build:
      dockerfile: ./Dockerfile
      context: ./client
  sceats:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "6969:80"

volumes:
  snacks-data:
