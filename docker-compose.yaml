services:
  backend:
    build: ./backend
    volumes:
      - snacks-data:/app/data
  frontend:
    build:
      dockerfile: ./Dockerfile
      context: ./client
  sceats-nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  snacks-data:

networks: 
  default:
    external: 
      name: sce